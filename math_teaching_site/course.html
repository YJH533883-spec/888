<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14232d">
  <title>课程详情｜思考不止，求证不息</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body class="course-page">
  <header class="site-header">
    <a class="brand" href="./" aria-label="返回首页">
      <span class="brand-mark" aria-hidden="true"><span></span><i></i></span>
      <span class="brand-name" id="brandName">数学讲解师</span>
    </a>
    <a class="header-cta" href="./#courses">全部课程 <span aria-hidden="true">↗</span></a>
  </header>
  <main class="course-detail section">
    <a class="back-link" href="./#courses">← 返回课程体系</a>
    <p class="section-kicker" id="courseEyebrow">COURSE DETAIL</p>
    <h1 id="courseTitle">课程标题</h1>
    <p class="detail-subtitle" id="courseSubtitle"></p>
    <div class="video-shell" id="videoShell">
      <div class="video-placeholder">
        <div class="placeholder-mark">∑</div>
        <p id="videoStatus">视频待接入</p>
        <span>课程视频将在这里播放</span>
      </div>
    </div>
    <section class="detail-description">
      <h2>课程简介</h2>
      <p id="courseDescription"></p>
    </section>
    <div class="detail-bottom">
      <span>思考不止，求证不息。</span>
      <a href="./#courses">继续探索课程 →</a>
    </div>
  </main>
  <footer class="site-footer">
    <a class="brand footer-brand" href="./">
      <span class="brand-mark" aria-hidden="true"><span></span><i></i></span>
      <span class="brand-name" id="footerBrandName">数学讲解师</span>
    </a>
    <p>以理解为起点，以求证为习惯。</p>
    <a class="back-top" href="./#top">返回首页 ↑</a>
  </footer>
  <script>
    (function () {
      const cfg = window.SITE_CONFIG || {};
      const params = new URLSearchParams(location.search);
      const id = params.get("id") || "01";
      const course = (cfg.courses || []).find(item => item.id === id);
      document.getElementById("brandName").textContent = cfg.brandName || "数学讲解师";
      document.getElementById("footerBrandName").textContent = cfg.brandName || "数学讲解师";
      if (!course) {
        document.getElementById("courseTitle").textContent = "暂未找到该课程";
        document.getElementById("courseSubtitle").textContent = "请返回课程体系选择其他板块。";
        document.getElementById("courseDescription").textContent = "";
        return;
      }
      document.title = course.title + "｜" + (cfg.slogan || "思考不止，求证不息。");
      document.getElementById("courseEyebrow").textContent = "COURSE " + course.id;
      document.getElementById("courseTitle").textContent = course.title;
      document.getElementById("courseSubtitle").textContent = course.subtitle || "";
      document.getElementById("courseDescription").textContent = course.description || "课程内容持续整理中。";
      const shell = document.getElementById("videoShell");
      const status = document.getElementById("videoStatus");
      if (course.embedHtml && course.status === "ready") {
        shell.innerHTML = '<div class="video-frame">' + course.embedHtml + '</div>';
      } else {
        status.textContent = course.status === "pending" ? "待更新" : "视频待接入";
      }
    })();
  </script>
</body>
</html>
